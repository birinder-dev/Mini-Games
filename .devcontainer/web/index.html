<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/html" xmlns="http://www.w3.org/1999/html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fun Mini Games Demo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box}
        body, html { width: 100%; height: 100%;
            overflow: hidden; background: #12100e; font-family: -apple-system, BlinkMacSystemFront, "Segoe UI", Roboto, sans-serif}

        #vnc-frame{
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        #mobile-warning{
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1b1713;
            color: #f3e5ab;
            z-index: 99999;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            text-align: center;
        }
        #mobile-warning h2{font-size: 26px;
            color: #ff6b6b; margin-bottom: 12px;
        }
        #mobile-warning p{
            font-size: 16px; color: #d1c7bd; max-width: 400px; line-height: 1.5; margin-bottom: 24px;
        }
        .icon-box{ font-size: 56px; margin-bottom: 16px}

        #loading-overlay{
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #261f18 0%, #110e0b, 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        .bar-container{
            width: 320px;
            height: 24px;
            border: 2px solid #c9a96e;
            border-radius: 12px;
            padding: 2px;
            position: relative;
            background: #191410;
            overflow: hidden;
            margin-bottom: 15px;
        }
        .liquid{
            height:  100%;
            width: 15%;
            border-radius: 8px;
            background: #70b919;
            box-shadow: inset 0 2px 0 0 rgba(255, 255, 255, 0.85), 0 0 10px rgba(112, 185, 25, 0.6);
            transition: width 0.3s ease;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0% {
                opacity: 0.8;
            }
            50% {
                opacity: 1;
            }
            100%{
                opacity: 0.8;
            }
        }
        .text{
            color: #e5d3b3;
            font-size: 15px;
            letter-spacing: 0.5px;
            margin-bottom: 25px;
        }

        .fallback{
            margin-top: 10px;
            text-align: center;
        }
        .fallback p{
            color: #8c7e72;
            font-size: 13px;
            margin-bottom: 8px;
        }
        .codespace-btn{
            display: inline-block;
            padding: 10px 18px;
            background: #238636;
            color: #fff;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            transition: background 0.2s;
        }
        .codespace-btn:hover{ background: #2ea043;}
    </style>
</head>
<body>

<div id="mobile-warning">
    <div class="icon-box">💻</div>
    <h2>Computer Required</h2>
    <p>The Mini-Games playable demo requires a desktop or laptop computer with a keyboard and mouse to play.</p>
    <p style="font-size: 13px; color: #7f7469;">Please open this link on your PC or Laptop.</p>
</div>

<div id="loading-overlay">
    <div style="text-align: center; margin-bottom: 20px;">
        <img src="art.png" alt="Mini-Games" style="max-width: 440px; width: 92%; height: auto; filter: drop-shadow(0 8px 20px rgba(0,0,0,0.8));">
    </div>

    <div class="bar-container">
        <div class="liquid" id="progress-bar"></div>
    </div>

    <div class="text" id="status-label">Booting Demo World & Cards...</div>

    <div class="fallback">
        <p>Host quota reached!</p>
        <a class="codespace-btn" href="https://codespaces.new/birinder-dev/Mini-Games" target="_blank">⚡ Launch Your Own Free Session on GitHub</a>
    </div>
</div>

<iframe id="vnc-frame" src="vnc.html?autoconnect=true&resize=scale"></iframe>

<script>
    function isMobile(){
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        const isM = /android|iphone|ipad|ipod|blackberry|iemobile|opera mini/i.test(userAgent.toLowerCase());
        const isSmallScreen = window.innerWidth <= 768 && ('ontouchstart' in window);
        return isM || isSmallScreen;
    }

    if(isMobile()){
        document.getElementById('mobile-warning').style.display = 'flex';
    }

    let progress = 15;
    const progressBar = document.getElementById('progress-bar');
    const statusLabel = document.getElementById('status-label');
    const overlay = document.getElementById('loading-overlay');

    const progressTimer = setInterval(() => {
        if(progress < 90){
            progress += Math.floor(Math.random() *8) + 2;
            progressBar.style.width = progress + '%';
            if(progress>40 && progress <70){
                statusLabel.innerText = "Loading Table & Custom Assets...";
            } else if (progress>=70){
                statusLabel.innerText = "Spawning Gambler into Tavern Box";
            }
        }
    }, 1500);

    const checkReady = setInterval(async () => {
        try{
            const res = await fetch('ready.txt?cache=' + Date.now());
            if(res.ok){
                clearInterval(checkReady);
                clearInterval(progressTimer);
                progressBar.style.width = '100%';
                statusLabel.innerText = "Ready! Entering Game...";

                setTimeout(() => {
                    overlay.style.opacity = '0';
                    setTimeout(() => {
                        overlay.style.display = 'none';
                    }, 800);
                }, 600);
            }
        } catch (err){}
    }, 2000);
</script>
</body>
</html>
